name: Deploy public documentation

on:
  push:
    branches: [main]
    paths:
      - "public-docs/**"
      - ".github/workflows/public-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-docs-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build public documentation
        run: node public-docs/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
